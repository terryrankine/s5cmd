name: needs-human
description: Open (or refresh) an issue labelled needs-human so the maintainer is notified.
inputs:
  title:
    required: true
  body:
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: ${{ inputs.title }}
        BODY: ${{ inputs.body }}
      run: |
        existing=$(gh issue list --label needs-human --state open --search "in:title \"$TITLE\"" --json number -q '.[0].number')
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body "Still failing: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        else
          gh issue create --title "$TITLE" --label needs-human --label automation --body "$BODY"
        fi
