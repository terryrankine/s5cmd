name: ci
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    strategy:
      matrix:
        go-version:
          - 1.27.x  # current
          - 1.24.x  # go.mod minimum
        os:
          - macos
          - ubuntu
          - windows

    name: build (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - run: make build

  test:
    strategy:
      matrix:
        go-version:
          - 1.27.x  # current
          - 1.24.x  # go.mod minimum
        os:
          - macos
          - ubuntu
          - windows

    name: test (${{ matrix.os }}/go-${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    # MinIO backs only the `select` e2e tests (the in-process fake S3 has no
    # SelectObjectContent); everything else runs against the fake. The
    # official image needs a command, which `services:` cannot pass, so
    # start it by hand.
    - name: Start MinIO
      if: matrix.os == 'ubuntu'
      run: |
        docker run -d --name minio -p 45677:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
        for _ in $(seq 1 30); do
          curl -sf http://localhost:45677/minio/health/live && exit 0
          sleep 1
        done
        docker logs minio
        exit 1

    - run: make test
      env:
        S5CMD_TEST_ENDPOINT_URL: ${{ (matrix.os == 'ubuntu') && 'http://localhost:45677' || '' }}
  qa:
    strategy:
      matrix:
        go-version:
          # Lint on current Go only. staticcheck (tools/go.mod) is built and
          # run with the latest Go; it lints the code as the `go` line in
          # go.mod targets it, so a second run on the minimum adds nothing.
          - 1.27.x  # current
        os:
          - ubuntu

    runs-on: ${{ matrix.os }}-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}

    - run: make bootstrap
    - run: make check
