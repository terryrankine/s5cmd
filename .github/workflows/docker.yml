name: docker
on:
  release:
    types: [published]
permissions:
  contents: read
  packages: write
jobs:
  multi:
    runs-on: ubuntu-latest
    env:
      # Upstream publishes to Docker Hub; forks publish to their own GHCR
      # namespace using the built-in token, so no extra secrets are needed.
      IS_UPSTREAM: ${{ github.repository_owner == 'peak' }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to DockerHub
        if: env.IS_UPSTREAM == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      -
        name: Login to GHCR
        if: env.IS_UPSTREAM != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Image name
        id: image
        run: |
          if [ "$IS_UPSTREAM" = "true" ]; then
            echo "name=peakcom/s5cmd" >> "$GITHUB_OUTPUT"
          else
            echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          fi
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64,linux/ppc64le,linux/riscv64,linux/arm/v6,linux/arm/v7,linux/386
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.event.release.tag_name }}
