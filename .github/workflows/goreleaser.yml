name: goreleaser
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
  issues: write
jobs:
  gcs_test:
    name: gcs-test
    runs-on: ubuntu-latest
    env:
      # Job-level env is visible to step `if`; step-level env is not.
      HAS_GCS_SECRETS: ${{ secrets.S5CMD_GCS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Run GCS tests
        if: env.HAS_GCS_SECRETS == 'true'
        run: make test_without_race
        env:
          S5CMD_ACCESS_KEY_ID: ${{ secrets.S5CMD_GCS_ACCESS_KEY_ID }}
          S5CMD_SECRET_ACCESS_KEY: ${{ secrets.S5CMD_GCS_SECRET_ACCESS_KEY }}
          S5CMD_ENDPOINT_URL: https://storage.googleapis.com
          S5CMD_IS_VIRTUAL_HOST: 1
          S5CMD_REGION: ${{ secrets.S5CMD_GCS_REGION }}
          S5CMD_I_KNOW_WHAT_IM_DOING: 1
      - name: Skip GCS tests
        if: env.HAS_GCS_SECRETS != 'true'
        run: echo "GCS secrets not configured, skipping"

  # Builds every target and creates a DRAFT release (release.draft: true in
  # .goreleaser.yml). Nothing is visible to users until the smoke job below
  # has run the shipped binary.
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}

  # Runs the binary that was actually uploaded, against a real MinIO,
  # including the path-traversal guard. Only a pass publishes the release
  # (which in turn triggers the docker workflow). A failure leaves the draft
  # in place and opens a needs-human issue.
  smoke-and-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GORELEASER_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the shipped Linux binary and verify its checksum
        run: |
          ver="${TAG#v}"
          gh release download "$TAG" --pattern "s5cmd_${ver}_Linux-64bit.tar.gz" --pattern 's5cmd_checksums.txt' -D dist
          cd dist && grep Linux-64bit s5cmd_checksums.txt | sha256sum -c - && tar xzf "s5cmd_${ver}_Linux-64bit.tar.gz"
          ./s5cmd version | grep -q "^$TAG" || { echo "version mismatch: $(./s5cmd version)"; exit 1; }
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Smoke test the shipped binary with the e2e suite
        # The in-process fake S3 accepts hostile keys ("..", ".") that MinIO
        # rejects, so the traversal guard is exercised for real.
        env:
          S5CMD_TEST_BINARY: dist/s5cmd
        run: |
          go test -mod=vendor -count=1 -run 'PathTraversal|DotKey|TestCopySingleS3ObjectToLocal$|TestCopyMultipleFlatS3ObjectsToLocal$|TestCopySingleFileToS3$|TestSyncLocalFolderToS3EmptyBucket$|TestRemoveMultipleS3Objects$|TestListSingleS3Object$|TestRunFromStdin$' ./e2e/ -v 2>&1 | grep -E '^(=== RUN|--- (PASS|FAIL|SKIP)|ok|FAIL)'
      - name: Publish
        run: |
          notes=$(python3 .github/scripts/release-notes.py "$TAG")
          [ -n "$notes" ] || notes="See CHANGELOG.md."
          { echo "$notes"; echo; echo "Docker image: ghcr.io/${GITHUB_REPOSITORY,,}:$TAG"; } > notes.md
          gh release edit "$TAG" --title "$TAG" --notes-file notes.md --draft=false --latest
      - if: failure()
        uses: ./.github/actions/needs-human
        with:
          title: "release ${{ github.ref_name }}: smoke test failed, draft not published"
          body: "The shipped binary failed the post-build smoke test. The release is still a draft. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
